[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digibook"
version = "0.1.0"
description = "Turn photos and scans of book pages into clean, uniform, searchable PDFs (English, Japanese, Arabic) with highlight detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "pillow-heif>=0.16",
    "pikepdf>=8",
    "pypdfium2>=4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
digibook = "digibook.cli:main"

[tool.setuptools.packages.find]
include = ["digibook*"]

[tool.setuptools.package-data]
digibook = ["static/*"]
